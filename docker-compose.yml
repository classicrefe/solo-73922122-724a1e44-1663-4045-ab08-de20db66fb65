services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lineage
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d lineage"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_ADMIN_DSN: postgresql://app:app@db:5432/lineage
      DATABASE_QUERY_DSN: postgresql://app:app@db:5432/lineage
    # 启动前幂等建表+播种（已存在数据时整表重置为预置演示数据）
    command: >
      sh -c "python -m scripts.seed_db &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
